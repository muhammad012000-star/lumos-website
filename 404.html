<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumos Studios</title>
    <script type="text/javascript">
      // GitHub Pages is a static host with no server-side rewrites, so any
      // direct visit/refresh of a client-side route (e.g. /portfolio/nine-pilates)
      // hits this 404 page. It re-encodes the path into a query string and
      // redirects to the app root, where the inline script in index.html
      // decodes it back before React Router mounts.
      // Based on https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
